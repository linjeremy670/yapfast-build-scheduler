name: Yapfast Windows Scheduler

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even when the commit already has a Windows release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yapfast-windows-scheduler
  cancel-in-progress: false

jobs:
  build:
    uses: linjeremy670/yapfast/.github/workflows/sync-and-build-windows-maybe-idk.yml@automation/windows-build
    with:
      force_build: ${{ inputs.force_build == true }}
    secrets:
      YAPFAST_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

name: Windows Build Verification

on:
  push:
    paths:
      - '.github/windows-build-test-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: linjeremy670/yapfast/.github/workflows/sync-and-build-windows-maybe-idk.yml@automation/windows-build
    with:
      force_build: true
    secrets:
      YAPFAST_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

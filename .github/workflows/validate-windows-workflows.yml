name: Validate Windows Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/builder_health.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/builder_health.py'

permissions:
  contents: read

# Collapse rapid successive edits without skipping checks on the newest commit.
concurrency:
  group: validate-windows-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scheduler workflows
        uses: actions/checkout@v5
        with:
          path: scheduler
      - name: Checkout Windows reusable workflow
        uses: actions/checkout@v5
        with:
          repository: linjeremy670/yapfast
          ref: automation/windows-build
          path: yapfast
      - name: Validate GitHub Actions YAML and expressions
        shell: bash
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -color \
            scheduler/.github/workflows/windows.yml \
            scheduler/.github/workflows/runner-health.yml \
            scheduler/.github/workflows/validate-windows-workflows.yml \
            scheduler/.github/workflows/compare-windows-binaries.yml \
            scheduler/.github/workflows/builder-health.yml \
            scheduler/.github/workflows/cleanup-old-runs.yml \
            yapfast/.github/workflows/sync-and-build-windows-maybe-idk.yml
      - name: Compile-check health summary
        run: python3 -m py_compile scheduler/scripts/builder_health.py

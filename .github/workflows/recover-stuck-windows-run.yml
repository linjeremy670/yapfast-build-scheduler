name: Recover Stuck Windows Run

on:
  push:
    paths:
      - '.github/stuck-run-recovery-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel orphaned run
        env:
          GH_TOKEN: ${{ secrets.YAPFAST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "YAPFAST_TOKEN is not available."
            exit 1
          fi
          gh api -X POST \
            repos/linjeremy670/yapfast-build-scheduler/actions/runs/43197649420/force-cancel
          echo "Force-cancel request accepted."
